[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xiloop"
version = "1.0.0"
description = "XiLoop - X-in-the-Loop orchestration: wire any controller to any plant model, run the loop, verify requirements."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Muhamad Alif Izzuwan Bin Ibrahim" }]
dependencies = ["pyyaml"]

[project.optional-dependencies]
plot = ["matplotlib"]
studio = ["pywebview>=5"]
hil = ["pyserial"]
all = ["matplotlib", "pywebview>=5", "pyserial"]
dev = ["pytest", "matplotlib", "pyserial"]

[project.scripts]
xiloop = "xiloop.cli:main"

[project.gui-scripts]
xiloop-studio = "xiloop.studio_app:main"

[tool.setuptools.packages.find]
include = ["xiloop*"]

[tool.setuptools.package-data]
xiloop = ["studio/*"]
